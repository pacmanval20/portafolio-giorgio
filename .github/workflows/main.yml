name: Publicar portafolio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Preparar la página
        run: rm -rf dist && mkdir dist && cp -r site/. dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
